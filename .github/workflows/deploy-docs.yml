name: Deploy docs to GitHub Pages

# docs/dist/ is generated by `npm run build` and gitignored, so the docs page
# can only be deployed from a fresh build — never straight from the branch.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Avoid overlapping deploys stepping on each other
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # tokens → lint → esbuild → tsc, then copies dist/ into docs/dist/
      - run: npm run build

      # Fail loudly if the copy step ever regresses, rather than shipping a
      # docs page with no styles.
      - name: Verify docs/dist exists
        run: test -f docs/dist/fernwell.css && test -f docs/dist/fernwell.iife.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
